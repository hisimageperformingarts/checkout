<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>His Image Performing Arts — Merch Checkout</title>
  <script src="https://js.stripe.com/v3/"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f7f5f0;
      --ink: #1c1c1c;
      --rose: #d9afa9;
      --rose-line: #dcb0aa;
      --rose-deep: #c98f88;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 44px 20px 56px;
    }
    .card { width: 100%; max-width: 440px; }

    /* ---- Header, matching the homepage hero ---- */
    .dancer {
      display: block;
      margin: 0 auto 28px;
      width: 92px;
      height: 115px;
      color: var(--rose);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 28px;
      color: var(--ink);
      margin: 0;
      text-align: center;
      line-height: 1.15;
    }
    .rule-thin {
      width: 90px;
      height: 1px;
      background: var(--ink);
      margin: 18px auto;
      opacity: 0.85;
    }
    .subtitle {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: var(--ink);
      text-align: center;
      margin: 0 0 6px;
    }
    .script {
      font-family: 'Alex Brush', cursive;
      font-size: 32px;
      color: var(--rose-deep);
      text-align: center;
      margin: 4px 0 0;
      line-height: 1;
    }
    .rule-wide {
      height: 1px;
      background: var(--rose-line);
      margin: 26px 0 30px;
    }

    /* ---- Products ---- */
    .product {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--white);
      border: 1px solid #e9e2dc;
      border-radius: 4px;
      padding: 16px 18px;
      margin-bottom: 12px;
      transition: border-color 0.15s, background 0.15s;
    }
    .product.selected {
      border-color: var(--rose);
      background: #fbf3f1;
    }
    .product-name {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--ink);
    }
    .product-price {
      font-size: 13px;
      color: var(--rose-deep);
      margin-top: 2px;
    }
    .qty { display: flex; align-items: center; gap: 12px; }
    .qty button {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--rose);
      background: var(--white);
      color: var(--ink);
      font-size: 15px;
      cursor: pointer;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qty button:active { background: #fbf3f1; }
    .qty span { min-width: 14px; text-align: center; font-weight: 500; }

    /* ---- Total & pay ---- */
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 22px 0 18px;
      padding-top: 16px;
      border-top: 1px solid var(--rose-line);
    }
    .total-row .label {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--ink);
    }
    .total-row .amount { font-size: 19px; font-weight: 600; color: var(--ink); }
    #pay-button {
      width: 100%;
      background: var(--ink);
      color: var(--cream);
      border: none;
      border-radius: 4px;
      padding: 15px;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #pay-button:hover:not(:disabled) { background: #000; }
    #pay-button:disabled { opacity: 0.4; cursor: not-allowed; }
    #checkout-form { margin-top: 22px; }

    /* ---- States ---- */
    #confirmation, #error-message { display: none; text-align: center; padding: 20px 12px 8px; }
    #confirmation .mark { width: 44px; height: 44px; margin: 0 auto 16px; color: var(--ink); }
    #confirmation h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--ink);
      font-size: 23px;
      margin: 0 0 6px;
    }
    #confirmation p { font-family: 'Alex Brush', cursive; font-size: 28px; color: var(--rose-deep); margin: 4px 0 0; }
    #loading { text-align: center; padding: 60px 0; color: var(--rose-deep); font-size: 14px; }
    #error-message p { color: #9c3b3b; font-size: 14px; line-height: 1.6; font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body>
  <div class="card">

    <div id="loading">Loading…</div>

    <div id="picker" style="display:none;">
      <svg class="dancer" viewBox="0 0 80 100" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="49" cy="9" rx="5.5" ry="6"/>
        <path d="M45 13c3 2 4 5 3 8-3-1-6 0-9 3-2 2-5 1-6-1-1-2 0-4 2-5 4-2 7-4 10-5z"/>
        <path d="M52 14c5 0 9 2 12 6 2 2 1 5-1 6-2 1-4 0-5-2-2-3-5-5-8-6 0-2 1-3 2-4z"/>
        <path d="M47 20c-2 5-2 10 1 14 1 2 0 4-2 5-5 2-10 6-13 11-1 2-4 3-6 1-2-1-2-4-1-6 4-6 10-11 16-13-1-4-1-8 1-11 1-2 3-2 4-1z"/>
        <path d="M49 33c3 3 4 7 3 11-1 5 0 10 3 14 1 2 0 5-2 6-2 1-5 0-6-2-3-5-4-11-3-17-2-2-3-5-2-8 1-3 4-5 7-4z"/>
        <path d="M44 46c1 6-1 11-5 15-3 3-4 7-3 11 1 2-1 5-3 5-3 1-5-1-5-3-1-6 1-11 5-16 2-2 3-5 3-8 1-3 4-5 8-4z"/>
        <path d="M52 47c4-1 8 0 11 3 4 4 6 9 6 15 0 2-2 4-4 4-2 0-4-2-4-4 0-4-1-7-4-10-2-2-5-3-8-3 0-2 1-4 3-5z"/>
      </svg>

      <h1>His Image Performing Arts</h1>
      <div class="rule-thin"></div>
      <p class="subtitle">Merch Checkout</p>
      <p class="script">Shop &amp; Go</p>

      <div class="rule-wide"></div>

      <div class="product" id="product-tshirt" data-price-id="price_1UD3ufEEsuxo66cWxO1J4ewS" data-name="T-Shirt" data-amount="22">
        <div>
          <div class="product-name">T-Shirt</div>
          <div class="product-price">$22.00</div>
        </div>
        <div class="qty">
          <button type="button" onclick="changeQty('tshirt', -1)" aria-label="Decrease T-Shirt quantity">−</button>
          <span id="qty-tshirt">0</span>
          <button type="button" onclick="changeQty('tshirt', 1)" aria-label="Increase T-Shirt quantity">+</button>
        </div>
      </div>

      <div class="product" id="product-sweatshirt" data-price-id="price_1UD3uzEEsuxo66cWzFSeJo8w" data-name="Sweatshirt" data-amount="40">
        <div>
          <div class="product-name">Sweatshirt</div>
          <div class="product-price">$40.00</div>
        </div>
        <div class="qty">
          <button type="button" onclick="changeQty('sweatshirt', -1)" aria-label="Decrease Sweatshirt quantity">−</button>
          <span id="qty-sweatshirt">0</span>
          <button type="button" onclick="changeQty('sweatshirt', 1)" aria-label="Increase Sweatshirt quantity">+</button>
        </div>
      </div>

      <div class="total-row">
        <span class="label">Total</span>
        <span class="amount" id="total-amount">$0.00</span>
      </div>

      <button id="pay-button" onclick="startCheckout()" disabled>Continue to Payment</button>

      <div id="checkout-form"></div>
    </div>

    <div id="confirmation">
      <svg class="mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="1.5"/>
        <path d="M14 24.5l6.5 6.5L34 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>Payment Received</h2>
      <p>Thank you for purchasing!</p>
    </div>

    <div id="error-message">
      <p>We couldn't confirm this payment.<br>If you were charged, please see a studio staff member.</p>
    </div>
  </div>

  <script>
    const stripe = Stripe('pk_live_51TLoebEEsuxo66cWPHxgJHfryk7eOEh5Ioq0uUGISQ5cfmdQG3FazN69mj1qo03D0QLDbr8Co9DFrQQuujw96pp200H0d50Rbw');

    const quantities = { tshirt: 0, sweatshirt: 0 };
    const prices = {
      tshirt: { id: 'price_1UD3ufEEsuxo66cWxO1J4ewS', amount: 22 },
      sweatshirt: { id: 'price_1UD3uzEEsuxo66cWzFSeJo8w', amount: 40 },
    };

    function changeQty(item, delta) {
      const next = quantities[item] + delta;
      if (next < 0) return;
      quantities[item] = next;
      document.getElementById('qty-' + item).textContent = next;
      document.getElementById('product-' + item).classList.toggle('selected', next > 0);
      updateTotal();
    }

    function updateTotal() {
      const total = quantities.tshirt * prices.tshirt.amount + quantities.sweatshirt * prices.sweatshirt.amount;
      document.getElementById('total-amount').textContent = '$' + total.toFixed(2);
      document.getElementById('pay-button').disabled = total === 0;
    }

    async function startCheckout() {
      const lineItems = [];
      if (quantities.tshirt > 0) lineItems.push({ priceId: prices.tshirt.id, quantity: quantities.tshirt });
      if (quantities.sweatshirt > 0) lineItems.push({ priceId: prices.sweatshirt.id, quantity: quantities.sweatshirt });

      document.getElementById('pay-button').disabled = true;
      document.getElementById('pay-button').textContent = 'Loading…';

      const response = await fetch('/.netlify/functions/create-checkout-session', {
        method: 'POST',
        body: JSON.stringify({ items: lineItems }),
      });
      const data = await response.json();

      if (!data.clientSecret) {
        alert('Something went wrong starting checkout. Please try again.');
        document.getElementById('pay-button').disabled = false;
        document.getElementById('pay-button').textContent = 'Continue to Payment';
        return;
      }

      document.querySelectorAll('.product, .total-row, #pay-button').forEach(el => el.style.display = 'none');

      const checkout = await stripe.initEmbeddedCheckout({
        clientSecret: data.clientSecret,
      });
      checkout.mount('#checkout-form');
    }

    async function checkForReturn() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');

      if (!sessionId) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('picker').style.display = 'block';
        updateTotal();
        return;
      }

      const response = await fetch('/.netlify/functions/check-session?session_id=' + encodeURIComponent(sessionId));
      const data = await response.json();

      document.getElementById('loading').style.display = 'none';

      if (data.status === 'paid') {
        document.getElementById('confirmation').style.display = 'block';
      } else {
        document.getElementById('error-message').style.display = 'block';
      }
    }

    checkForReturn();
  </script>
</body>
</html>
